          <div><b style={{color:'#7dd3fc'}}>2. Định giá theo độ co giãn:</b> niche nhạy giá (Christmas, Halloween) → giá cạnh tranh; niche ít nhạy (Retro, Raccoon) → định giá cao tăng biên.</div>
          <div><b style={{color:'#7dd3fc'}}>3. Đòn bẩy lớn nhất là lượt xem:</b> mô hình OLS cho thấy views là yếu tố mạnh nhất (β=+0.69) → đầu tư vào hiển thị/marketing quan trọng hơn hạ giá.</div>
          <div><b style={{color:'#7dd3fc'}}>4. Niche thật sự khác nhau:</b> ANOVA xác nhận (p&lt;0.001) → chọn đúng niche là quyết định có cơ sở thống kê.</div>
        </div>
      </div>
    </div>
  );
}
